name: Map Data

# The vector basemap the app reads online (#31, step 2 of
# docs/konzept-offline-karten.md).
#
# Cuts a region (tool/regions.json, docs/konzept-regionen.md: DACH, and
# southern Canada since 18c) out of the daily Protomaps planet build
# with the official `pmtiles` tool, proves the extract
# against its source, uploads it to Cloudflare R2 and then proves the
# PUBLIC copy on tiles.mcbuchi.de over exactly the path the app takes:
# Range requests with an Origin header. The app never sees an archive
# this workflow has not read back.
#
# Zoom 13 by operator decision (2026-09-28): tracks are in the tiles from
# z12, paths, footways and steps from z13 (measured in PilzBuddy), and the
# style draws only small streams from z14 on. Roughly 2.9 GB instead of
# 5.5 GB for z14; the cut can be repeated at 14 later without touching
# the app.
#
# Dated file names (`dach-<build>.pmtiles`, `ca/map-<build>.pmtiles`)
# plus a small manifest (`dach.json`, `ca/map.json`) that names the
# current file: an app session caches the
# archive's directories, and overwriting the archive under it would make
# those offsets point into a different file. The previous archive stays
# until r2-prune.yml removes it two days later, so sessions in flight
# keep working. A region with an overview (Canada) gets it cut in the
# same run: z0-7 of the whole country, a download in the app (the DACH
# overview ships in the binary). The last step rewrites the index
# `regions.json` from what the host holds.
#
# Two modes, `plan` measures only (headers and directories, a few MB) and
# publishes nothing; `publish` cuts and uploads. A monthly schedule keeps
# newly mapped paths coming; Protomaps builds daily, that is more than a
# trail network changes.
#
# Secrets (R2 API token, Object Read & Write on the bucket) go through
# `env:` into a detection step; `secrets.` is not available in `if:` and
# GitHub silently drops the whole file (PilzBuddy, 2026-08-13). Without
# them the publish run says so in the summary and stops before cutting.
#
# No Version Guard concern: nothing here lands in a binary.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = measure only, publish = cut, upload, verify"
        required: true
        type: choice
        options: ["plan", "publish"]
        default: "plan"
      maxzoom:
        description: "Highest zoom to include"
        required: false
        type: string
        default: "13"
      plan_zooms:
        description: "Zooms to measure (plan mode), space separated"
        required: false
        type: string
        default: "12 13 14"
      region:
        description: "Which region of tool/regions.json (docs/konzept-regionen.md)"
        required: false
        type: choice
        options: ["dach", "ca"]
        default: "dach"
      plan_select:
        description: "plan: measure countries instead of the DACH box — KEY=VALUES on Natural Earth (e.g. ISO_A2_EH=CA), or world"
        required: false
        type: string
        default: ""
  schedule:
    # Monthly, publish with the defaults: DACH on the 1st, Canada on the
    # 15th — one region at a time, so at most one previous archive lies
    # in the bucket (docs/konzept-regionen.md, section 3).
    - cron: "17 3 1 * *"
    - cron: "17 3 15 * *"

# Never two runs at once: publish rewrites the manifest, and two runs
# would race on which archive it ends up naming.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned deliberately: a basemap tool that changes shape under us would
  # change what the extract contains without anyone choosing it.
  PMTILES_VERSION: "1.28.0"
  # West, south, east, north. `--bbox=…` with the equals sign: argparse
  # reads a leading minus as an option, and DACH only escapes that by
  # starting east of Greenwich. DACH's box, the same as in
  # tool/regions.json (its self-test holds them together); "Pick the
  # region" replaces it with the box of another region.
  DACH_BBOX: "5.5,45.5,17.5,55.5"
  MODE: ${{ inputs.mode || 'publish' }}
  # The region of this run. A schedule carries no inputs, so the 15th's
  # cron names Canada; everything else is DACH. "Pick the region" turns
  # it into box, polygon and paths (tool/regions.py).
  REGION: ${{ inputs.region || (github.event.schedule == '17 3 15 * *' && 'ca') || 'dach' }}
  MAXZOOM: ${{ inputs.maxzoom || '13' }}
  PLAN_ZOOMS: ${{ inputs.plan_zooms || '12 13 14' }}
  # Empty = the region. Otherwise the map beyond it (#220): a selection
  # of Natural Earth countries (public domain, pinned by tag AND checksum
  # — a border file that changes under a measurement changes the
  # measurement), or the whole world. Plan only. The same border file
  # cuts the polygon regions (Canada).
  PLAN_SELECT: ${{ inputs.plan_select || '' }}
  NE_COUNTRIES_URL: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_50m_admin_0_countries.geojson
  NE_COUNTRIES_SHA256: 3e458fc036ad0a66411f2c1e6cac49c5d7bfb81cb1123bc513b22511a2b7fdeb
  # Public values, deliberately in the file and not in repository
  # variables: the app carries the same host as a constant, and the
  # privacy policy guard reads it from there.
  R2_BUCKET: buddy-tiles
  R2_PREFIX: trailbuddy
  PUBLIC_BASE: https://tiles.mcbuchi.de/trailbuddy

jobs:
  maps:
    name: Cut, upload and verify the basemap of a region
    runs-on: ubuntu-latest
    # A z13 extract reads about 3 GB through Range requests, the upload
    # sends them again.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Are the R2 secrets there?
        id: r2
        env:
          ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$ACCOUNT" ] && [ -n "$KEY" ] && [ -n "$SECRET" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Map Data: no upload"
              echo
              echo "One of R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY is missing."
              echo "Create an R2 API token (Object Read & Write, bucket \`$R2_BUCKET\`) in the"
              echo "Cloudflare dashboard and store the three values as repository secrets."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pick the region
        # tool/regions.json is the one list. For DACH this sets the values
        # the env block already holds (a DACH run stays what it was);
        # another region gets its box, its polygon (Natural Earth, capped
        # at a latitude) and its paths under `<id>/`.
        run: |
          set -euo pipefail
          args=()
          if [ "$REGION" != "dach" ]; then
            curl -sSL --fail --max-time 120 "$NE_COUNTRIES_URL" -o /tmp/countries.geojson
            echo "$NE_COUNTRIES_SHA256  /tmp/countries.geojson" | sha256sum -c -
            args=(--countries /tmp/countries.geojson --out-dir /tmp/region)
          fi
          python3 tool/regions.py env "$REGION" --workflow map "${args[@]}" | tee -a "$GITHUB_ENV"
          echo "## Region \`$REGION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Find the newest Protomaps daily build
        id: source
        # Dated files, no "latest" alias. The probe asks for ONE byte and
        # insists on a 206: that also proves the host serves ranges before
        # we spend an hour on it. `-L` because the reader follows
        # redirects too, and a 302 is not a 206.
        run: |
          set -euo pipefail
          found=""
          last=""
          for back in $(seq 0 9); do
            day=$(date -u -d "-${back} day" +%Y%m%d)
            url="https://build.protomaps.com/${day}.pmtiles"
            code=$(curl -sSL -o /dev/null -w '%{http_code}' \
                     -r 0-0 --max-time 60 "$url" || echo "000")
            echo "  $day -> $code"
            last="$day:$code"
            if [ "$code" = "206" ]; then found="$url"; echo "build=$day" >> "$GITHUB_OUTPUT"; break; fi
          done
          if [ -z "$found" ]; then
            echo "::error::No Protomaps daily build answered a Range request in the last 10 days (last probe: ${last}). 000 means the host was unreachable, 4xx/5xx that it answered but refused, 200 that it ignored Range."
            exit 1
          fi
          echo "url=$found" >> "$GITHUB_OUTPUT"
          echo "Quelle: $found"

      - name: Measure bytes per zoom
        if: env.MODE == 'plan'
        env:
          SOURCE: ${{ steps.source.outputs.url }}
        run: |
          set -euo pipefail
          area=("--bbox=$DACH_BBOX")
          label="bbox \`$DACH_BBOX\`"
          if [ -n "$REGION_POLYGON" ]; then
            area=("--region=$REGION_POLYGON")
            label="region \`$REGION\` (polygon from tool/regions.json)"
          fi
          if [ "$PLAN_SELECT" = "world" ]; then
            # The whole Web Mercator square as one polygon: a bbox of the
            # world would enumerate 89 million z13 ids.
            echo '{"type":"Polygon","coordinates":[[[-180,-85.0511],[180,-85.0511],[180,85.0511],[-180,85.0511],[-180,-85.0511]]]}' > /tmp/world.geojson
            area=("--region=/tmp/world.geojson")
            label="the whole world"
          elif [ -n "$PLAN_SELECT" ]; then
            curl -sSL --fail --max-time 120 "$NE_COUNTRIES_URL" -o /tmp/countries.geojson
            echo "$NE_COUNTRIES_SHA256  /tmp/countries.geojson" | sha256sum -c -
            area=("--region=/tmp/countries.geojson" "--select=$PLAN_SELECT")
            label="Natural Earth countries \`$PLAN_SELECT\`"
          fi
          {
            echo "## Map extract plan"
            echo
            echo "Source: \`$SOURCE\`, $label"
            echo
            echo "| asked | measured | estimated file | measuring cost |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for zoom in $PLAN_ZOOMS; do
            out=$(python3 tool/map_tiles.py plan --source "$SOURCE" \
                    "${area[@]}" "--maxzoom=$zoom" --max-bytes 100000000000 || true)
            span=$(echo "$out" | sed -n 's/^zoom *\(.*\)$/\1/p' | head -1)
            size=$(echo "$out" | sed -n 's/^estimated file size *\(.*\)$/\1/p' | head -1)
            cost=$(echo "$out" | sed -n 's/^read \(.*\)$/\1/p' | head -1)
            echo "| z$zoom | ${span:-?} | ${size:-?} | ${cost:-?} |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Install the pmtiles tool
        if: env.MODE == 'publish' && steps.r2.outputs.present == 'true'
        # The official Go implementation cuts the extract. A second
        # implementation of a format we do not own would put a subtly
        # malformed archive in front of users, where it fails in a browser
        # rather than here.
        run: |
          set -euo pipefail
          url="https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          if ! curl -sSL --fail "$url" -o /tmp/pmtiles.tar.gz; then
            echo "::error::Could not download $url — check PMTILES_VERSION against the go-pmtiles releases."
            exit 1
          fi
          tar -xzf /tmp/pmtiles.tar.gz -C /tmp pmtiles
          sudo install -m 0755 /tmp/pmtiles /usr/local/bin/pmtiles
          pmtiles version

      - name: Cut and check the extract
        if: env.MODE == 'publish' && steps.r2.outputs.present == 'true'
        env:
          SOURCE: ${{ steps.source.outputs.url }}
          SOURCE_BUILD: ${{ steps.source.outputs.build }}
        run: |
          set -euo pipefail
          rm -rf build/maps && mkdir -p build/maps
          # `export`, because the manifest writer below is a child process:
          # $GITHUB_ENV reaches only the LATER steps, not this one (the
          # first publish run failed here with KeyError: 'file' after a
          # successful extract).
          export file="dach-${SOURCE_BUILD}.pmtiles"
          [ "$REGION" = "dach" ] || file="${MAP_STEM}-${SOURCE_BUILD}.pmtiles"
          echo "file=$file" >> "$GITHUB_ENV"
          # A box for DACH, the capped country outline for Canada — the
          # check below proves the extract against the same area.
          area=("--bbox=$DACH_BBOX")
          [ -z "$REGION_POLYGON" ] || area=("--region=$REGION_POLYGON")
          mkdir -p "$(dirname "build/maps/$file")"
          pmtiles extract "$SOURCE" "build/maps/$file" \
            "${area[@]}" "--maxzoom=$MAXZOOM"
          # An extract that holds the wrong tiles is a valid archive; in
          # the app that reads as "the map is blank here". Proven here
          # against what was ORDERED (bbox, maxzoom), not the file's own
          # header — a wrongly cut archive states its wrong bbox without
          # contradicting itself.
          python3 tool/map_tiles.py check --source "$SOURCE" \
            --extract "build/maps/$file" "${area[@]}" \
            "--maxzoom=$MAXZOOM" --samples=80
          python3 - <<'PY'
          import hashlib, json, os, time
          path = f"build/maps/{os.environ['file']}"
          digest = hashlib.sha256()
          with open(path, "rb") as handle:
              for chunk in iter(lambda: handle.read(1 << 20), b""):
                  digest.update(chunk)
          manifest = {
              "format": 1,
              # Relative to the manifest's folder: `dach-…` at the root,
              # `map-…` next to `ca/map.json`.
              "file": os.path.basename(os.environ["file"]),
              "bytes": os.path.getsize(path),
              "sha256": digest.hexdigest(),
              "maxzoom": int(os.environ["MAXZOOM"]),
              "bbox": [float(v) for v in os.environ["DACH_BBOX"].split(",")],
              "region": os.environ["REGION"],
              "source": os.environ["SOURCE"],
              "source_build": os.environ["SOURCE_BUILD"],
              "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "attribution": "© OpenStreetMap contributors · Protomaps (ODbL)",
          }
          with open(f"build/maps/{os.environ['MAP_MANIFEST']}", "w") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Cut and check the overview
        if: env.MODE == 'publish' && steps.r2.outputs.present == 'true' && env.OVERVIEW_STEM != ''
        # z0-7 of the whole country, also north of the map's cap: offline,
        # zoomed out, the app shows land, water and the big roads there.
        # The DACH overview ships in the binary instead (concept 1.3).
        env:
          SOURCE: ${{ steps.source.outputs.url }}
          SOURCE_BUILD: ${{ steps.source.outputs.build }}
        run: |
          set -euo pipefail
          export overview="${OVERVIEW_STEM}-${SOURCE_BUILD}.pmtiles"
          echo "overview=$overview" >> "$GITHUB_ENV"
          pmtiles extract "$SOURCE" "build/maps/$overview" \
            "--region=$OVERVIEW_POLYGON" "--maxzoom=$OVERVIEW_MAXZOOM"
          python3 tool/map_tiles.py check --source "$SOURCE" \
            --extract "build/maps/$overview" "--region=$OVERVIEW_POLYGON" \
            "--maxzoom=$OVERVIEW_MAXZOOM" --samples=40
          python3 - <<'PY'
          import hashlib, json, os, time
          path = f"build/maps/{os.environ['overview']}"
          with open(path, "rb") as handle:
              digest = hashlib.sha256(handle.read()).hexdigest()
          manifest = {
              "format": 1,
              "file": os.path.basename(os.environ["overview"]),
              "bytes": os.path.getsize(path),
              "sha256": digest,
              "maxzoom": int(os.environ["OVERVIEW_MAXZOOM"]),
              "region": os.environ["REGION"],
              "source": os.environ["SOURCE"],
              "source_build": os.environ["SOURCE_BUILD"],
              "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "attribution": "© OpenStreetMap contributors · Protomaps (ODbL)",
          }
          with open(f"build/maps/{os.environ['OVERVIEW_MANIFEST']}", "w") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload to R2
        if: env.MODE == 'publish' && steps.r2.outputs.present == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
        # The archive first, immutable and long-cached (its name carries
        # the build); the manifest last and short-cached — it is the
        # pointer that flips. Older archives beyond the previous one are
        # removed afterwards: sessions in flight keep the previous file
        # (r2-prune.yml removes that one, too, after two days).
        # `.eu.` in the endpoint: the bucket was created with EU
        # jurisdiction (operator, 2026-09-28), and such a bucket exists only
        # behind the EU endpoint — the plain one answers "no such bucket".
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.eu.r2.cloudflarestorage.com"
          aws --endpoint-url "$endpoint" s3 cp "build/maps/$file" \
            "s3://${R2_BUCKET}/${R2_PREFIX}/$file" \
            --content-type application/octet-stream \
            --cache-control "public, max-age=31536000, immutable" --no-progress
          if [ -n "${overview:-}" ]; then
            aws --endpoint-url "$endpoint" s3 cp "build/maps/$overview" \
              "s3://${R2_BUCKET}/${R2_PREFIX}/$overview" \
              --content-type application/octet-stream \
              --cache-control "public, max-age=31536000, immutable" --no-progress
            aws --endpoint-url "$endpoint" s3 cp "build/maps/$OVERVIEW_MANIFEST" \
              "s3://${R2_BUCKET}/${R2_PREFIX}/$OVERVIEW_MANIFEST" \
              --content-type application/json \
              --cache-control "public, max-age=300" --no-progress
          fi
          aws --endpoint-url "$endpoint" s3 cp "build/maps/$MAP_MANIFEST" \
            "s3://${R2_BUCKET}/${R2_PREFIX}/$MAP_MANIFEST" \
            --content-type application/json \
            --cache-control "public, max-age=300" --no-progress
          # The region's own folder: `dach-…` at the root, `map-…` and
          # `overview-…` under `ca/`.
          stems=("$(basename "$MAP_STEM")")
          [ -z "$OVERVIEW_STEM" ] || stems+=("$(basename "$OVERVIEW_STEM")")
          for stem in "${stems[@]}"; do
            names=$(aws --endpoint-url "$endpoint" s3 ls "s3://${R2_BUCKET}/${R2_PREFIX}/${REGION_DIR}" \
                      | awk '{print $4}' | grep -E "^${stem}-[0-9]{8}\.pmtiles$" | sort || true)
            keep2=$(echo "$names" | tail -2)
            for old in $names; do
              if ! echo "$keep2" | grep -qx "$old"; then
                aws --endpoint-url "$endpoint" s3 rm "s3://${R2_BUCKET}/${R2_PREFIX}/${REGION_DIR}$old"
                echo "removed ${REGION_DIR}$old"
              fi
            done
          done

      - name: Verify the public copy the way the app reads it
        if: env.MODE == 'publish' && steps.r2.outputs.present == 'true'
        env:
          SOURCE: ${{ steps.source.outputs.url }}
        # Three things, all of which the app needs and none of which the
        # upload proves: the host answers a Range request with 206 and
        # `accept-ranges: bytes`; it sends `access-control-allow-origin`
        # for the app's origin (without it the browser sees nothing, with
        # no error); and the bytes it serves are the source's — `check`
        # reads the PUBLIC URL over Range like the app and compares tiles
        # against the planet build.
        run: |
          set -euo pipefail
          url="$PUBLIC_BASE/$file"
          headers=$(curl -sSL -D - -o /dev/null -r 0-15 --max-time 60 \
                      -H "Origin: https://macbuchi.github.io" "$url" | tr -d '\r' | tr 'A-Z' 'a-z')
          echo "$headers"
          # A Cloudflare bot challenge is a ZONE setting (Bot Fight Mode,
          # Security Level, a WAF rule), not a bucket or CORS problem — and
          # the app's clients cannot solve a challenge any more than curl
          # can. Name it, with the Ray ID that Security → Events resolves
          # to the rule that fired (first publish run, 2026-09-28).
          if echo "$headers" | grep -q '^cf-mitigated: challenge'; then
            ray=$(echo "$headers" | sed -n 's/^cf-ray: *//p')
            echo "::error::$url: Cloudflare challenged the request (cf-ray $ray). A bot-protection setting on the zone blocks non-browser clients — look the Ray ID up under Security → Events and exempt this hostname (or switch the rule off); the bucket and the upload are fine."
            exit 1
          fi
          echo "$headers" | grep -q '^http/[0-9.]* 206' || { echo "::error::$url: no 206 on a Range request — the app cannot read this host"; exit 1; }
          echo "$headers" | grep -q '^accept-ranges: bytes' || { echo "::error::$url: no accept-ranges: bytes"; exit 1; }
          echo "$headers" | grep -q '^access-control-allow-origin:' || { echo "::error::$url: no access-control-allow-origin — set the bucket's CORS rule (GET/HEAD, range headers exposed)"; exit 1; }
          curl -sSL --max-time 60 "$PUBLIC_BASE/$MAP_MANIFEST?verify=$file" | python3 -c 'import json,os,sys; m=json.load(sys.stdin); assert m["file"]==os.path.basename(sys.argv[1]), m' "$file"
          area=("--bbox=$DACH_BBOX")
          [ -z "$REGION_POLYGON" ] || area=("--region=$REGION_POLYGON")
          python3 tool/map_tiles.py check --source "$SOURCE" \
            --extract "$url" "${area[@]}" "--maxzoom=$MAXZOOM" --samples=40
          if [ -n "${overview:-}" ]; then
            curl -sSL --max-time 60 "$PUBLIC_BASE/$OVERVIEW_MANIFEST?verify=$overview" | python3 -c 'import json,os,sys; m=json.load(sys.stdin); assert m["file"]==os.path.basename(sys.argv[1]), m' "$overview"
            python3 tool/map_tiles.py check --source "$SOURCE" \
              --extract "$PUBLIC_BASE/$overview" "--region=$OVERVIEW_POLYGON" \
              "--maxzoom=$OVERVIEW_MAXZOOM" --samples=24
          fi
          {
            echo "## Basemap published"
            echo
            echo "- \`$url\` ($(stat -c %s "build/maps/$file" | numfmt --to=iec-i --suffix=B)), zoom 0–$MAXZOOM"
            echo "- manifest \`$PUBLIC_BASE/$MAP_MANIFEST\`"
            [ -z "${overview:-}" ] || echo "- overview \`$PUBLIC_BASE/$overview\` ($(stat -c %s "build/maps/$overview" | numfmt --to=iec-i --suffix=B)), zoom 0–$OVERVIEW_MAXZOOM"
            echo "- 206 + accept-ranges + CORS verified, $(echo 40) sampled tiles match the source"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update the region index
        if: env.MODE == 'publish' && steps.r2.outputs.present == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
        # `regions.json` lists the regions whose map manifest is on the
        # host, with the manifests each one has — written from the PUBLIC
        # host after the verify, so it never names something the app
        # cannot read.
        run: |
          set -euo pipefail
          python3 tool/regions.py index --public-base "$PUBLIC_BASE" --out build/regions.json
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.eu.r2.cloudflarestorage.com" s3 cp build/regions.json \
            "s3://${R2_BUCKET}/${R2_PREFIX}/regions.json" \
            --content-type application/json \
            --cache-control "public, max-age=300" --no-progress
