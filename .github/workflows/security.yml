name: Security

# Schwachstellen-Scan über die Lockfile (OSV-Datenbank) und Lizenz-Gate über
# den ganzen Abhängigkeitsbaum. Muster PilzBuddy, dort ausführlich
# begründet: „OSV (PR)" meldet nur, was DIESER PR neu einführt, und darf
# blockieren; „OSV (wöchentlich)" scannt den Bestand und meldet per Mail.
#
# Bewusst OHNE `dependency-review` zum Start: Der Job braucht den
# eingeschalteten Dependency Graph (Repo-Einstellung) und bricht sonst mit
# „not supported on this repository" ab — ein roter Check, der kein Code-
# Fehler ist. Er kommt, sobald die Einstellung steht (siehe CLAUDE.md).

on:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan-pr:
    name: OSV (PR)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0

  osv-scan-full:
    name: OSV (wöchentlich)
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0

  # Der einzige Lizenz-Check: eine ALLOW-Liste über alle Pakete, gelesen
  # aus den echten LICENSE-Dateien (tool/license_config.yaml). Blockierend.
  licenses:
    name: Lizenzen (Gesamtbestand)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: dart pub global activate license_checker
      # `paket:skript`, NICHT `paket:binärname` (PilzBuddy-Lehre).
      - name: Lizenzen prüfen
        run: dart pub global run license_checker:license_checker -c tool/license_config.yaml check-licenses
