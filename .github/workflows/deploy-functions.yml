name: Deploy Edge Functions

# Bringt `supabase/functions/**` in die Live-Umgebung (#34; PilzBuddy #277).
#
# **Warum es diesen Workflow braucht.** Der Schema Check spielt SQL-Patches
# aus dem PR ein — Edge Functions nicht. In PilzBuddy lag `send-push` nach
# dem Merge deshalb nur im Repo: Testknopf und Cron-Versand liefen beide
# ins Leere, ohne dass irgendwo ein Fehler stand. Und `supabase/` ist vom
# Version Guard ausgenommen — eine Änderung an der Function bringt nicht
# einmal einen Versions-Bump, an dem jemand stutzen könnte.
#
# Nur auf `main` und nur, wenn sich wirklich etwas an den Functions oder
# ihrer Konfiguration geändert hat — ein Deploy je Merge wäre Lärm.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # SHA-gepinnt wie überall sonst, und die CLI-Version festgenagelt
      # wie in ci.yml: `latest` hieße, dass sich das Werkzeug unter uns
      # ändert, ohne dass jemand etwas getan hat.
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        with:
          version: 2.109.1

      # Ohne Token passiert NICHTS, und zwar sichtbar: Der Schritt wird
      # übersprungen und die Zusammenfassung sagt warum. Ein Job, der ohne
      # Secret rot würde, wäre bei jedem Merge ein falscher Alarm — und
      # einer, der still durchliefe, wäre schlimmer als keiner.
      #
      # ABER: `secrets` ist in `if:` nicht verfügbar. Mit
      # `if: ${{ secrets.… }}` verwarf GitHub in PilzBuddy die ganze
      # Datei beim Einlesen — der Workflow dort ist monatelang KEIN
      # einziges Mal gelaufen, jeder vermeintliche Lauf war ein
      # Startfehler. Daher der Umweg über einen Feststell-Schritt
      # (Secrets in `env:` sind erlaubt, `steps` ist in `if:` verfügbar);
      # test/release_workflow_test.dart verbietet `secrets.` in `if:`.
      - name: Token vorhanden?
        id: token
        env:
          T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: echo "have=$([ -n "$T" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.token.outputs.have == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy --project-ref ibxrjgvwouuoydhdkfmf
          echo "### Edge Functions deployt" >> "$GITHUB_STEP_SUMMARY"
          supabase functions list --project-ref ibxrjgvwouuoydhdkfmf \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Ohne Token übersprungen
        if: steps.token.outputs.have == 'false'
        run: |
          {
            echo "### Nicht deployt — \`SUPABASE_ACCESS_TOKEN\` fehlt"
            echo
            echo "Persönliches Zugriffstoken unter"
            echo "<https://supabase.com/dashboard/account/tokens> erzeugen"
            echo "und als Repo-Secret \`SUPABASE_ACCESS_TOKEN\` hinterlegen."
            echo
            echo "Bis dahin müssen Änderungen an \`supabase/functions/\`"
            echo "von Hand deployt werden:"
            echo '```'
            echo "supabase functions deploy --project-ref ibxrjgvwouuoydhdkfmf"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
