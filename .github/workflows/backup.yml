name: Database Backup

on:
  schedule:
    - cron: "17 3 * * 1" # Monday, 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dump, validate and encrypt without uploading"
        type: boolean
        default: true

concurrency:
  group: database-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    if: github.repository == 'MacBuchi/trailbuddy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check setup
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          UPLOAD_CONFIGURED: ${{ secrets.BACKUP_REPO_TOKEN != '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ -z "$BACKUP_AGE_RECIPIENT" || ( "$DRY_RUN" != true && "$UPLOAD_CONFIGURED" != true ) ]]; then
            echo "::error::Backup setup is incomplete. See docs/backup-restore.md."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the live PostgreSQL major version
        id: postgres
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          : "${SUPABASE_DB_URL:?Configure SUPABASE_DB_URL}"
          version=$(psql --dbname="$SUPABASE_DB_URL" -XAtwqc 'show server_version_num')
          [[ $version =~ ^[0-9]{6}$ ]]
          echo "major=$((version / 10000))" >> "$GITHUB_OUTPUT"

      - name: Install the matching PostgreSQL client and age
        env:
          PG_MAJOR: ${{ steps.postgres.outputs.major }}
        run: |
          # Ubuntu 24.04 ships PostgreSQL 16. Add PostgreSQL's signed
          # repository when the server needs a client unavailable on the runner.
          if ! apt-cache show "postgresql-client-$PG_MAJOR" >/dev/null 2>&1; then
            sudo install -d /usr/share/postgresql-common/pgdg
            curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
            sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<'PGDG'
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          PGDG
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$PG_MAJOR" age
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"

      - name: Dump, validate and encrypt without uploading
        if: inputs.dry_run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: bash tool/db_backup.sh --no-upload

      - name: Dump, validate, encrypt and upload
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: bash tool/db_backup.sh
