name: Database Backup

on:
  schedule:
    - cron: "17 3 * * 1" # Monday, 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dump, validate and encrypt without uploading"
        type: boolean
        default: true

concurrency:
  group: database-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    if: github.repository == 'MacBuchi/trailbuddy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check setup
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          UPLOAD_CONFIGURED: ${{ secrets.BACKUP_REPO_TOKEN != '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ -z "$BACKUP_AGE_RECIPIENT" || ( "$DRY_RUN" != true && "$UPLOAD_CONFIGURED" != true ) ]]; then
            echo "::error::Backup setup is incomplete. See docs/backup-restore.md."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install PostgreSQL client and age
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/trailbuddy-pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump, validate and encrypt without uploading
        if: inputs.dry_run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: bash tool/db_backup.sh --no-upload

      - name: Dump, validate, encrypt and upload
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: bash tool/db_backup.sh
