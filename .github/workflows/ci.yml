name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Dieser Workflow liest, baut und lädt Artefakte hoch — mehr Rechte braucht
# er nicht. Klein gehalten begrenzt das den Schaden einer gekaperten
# Third-Party-Action (PilzBuddy-Muster).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # AGENTS.md (Codex) ist ein Symlink auf CLAUDE.md, keine Kopie — eine
      # Kopie veraltet still (PilzBuddy #607).
      - name: AGENTS.md zeigt auf CLAUDE.md
        run: |
          test -L AGENTS.md && test "$(readlink AGENTS.md)" = CLAUDE.md || {
            echo "::error::AGENTS.md muss ein Symlink auf CLAUDE.md sein (ln -sf CLAUDE.md AGENTS.md)"
            exit 1
          }
      # Die Technik-Notizen liegen je Ordner in einer eigenen CLAUDE.md
      # (#237): Index und Teildateien zusammenhalten, Root klein halten.
      - name: Agenten-Regeln (CLAUDE.md-Index)
        run: |
          python3 tool/agent_docs.py --self-test
          python3 tool/agent_docs.py
          python3 tool/session_status.py --self-test
          python3 tool/context_nudge.py --self-test
          sh -n tool/dart_mcp.sh
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Die Skripte in tool/ haben Selbsttests, aber niemanden, der sie
      # ausführt — sie verrotten sonst still (PilzBuddy #151). Alle laufen
      # ohne Netz, ohne Schlüssel, in Sekunden.
      - name: Tool self-tests
        run: |
          python3 tool/trail_match.py --self-test > /dev/null
          python3 tool/elevation_measure.py --self-test > /dev/null
          bash tool/schema_check.sh --self-test > /dev/null
          python3 tool/feedback_bot.py --self-test > /dev/null
          python3 tool/feedback_bot.py --test-digest > /dev/null
          python3 tool/official_trails.py --self-test > /dev/null
          python3 tool/generated_assets.py --self-test > /dev/null
          python3 tool/transform_map_style.py --self-test > /dev/null
          python3 tool/map_tiles.py --self-test > /dev/null
          python3 tool/poi_extract.py --self-test > /dev/null
          python3 tool/brand_icons.py --self-test > /dev/null
          python3 tool/highlights_preview.py --self-test > /dev/null
          python3 tool/route_measure.py --self-test > /dev/null
          python3 tool/height_tiles.py --self-test > /dev/null
          python3 tool/way_tags.py --self-test > /dev/null
      # Eigener Schritt, nicht bei den Selbsttests: Der hier prüft nicht
      # ein Werkzeug, sondern die ausgelieferten Dateien — Kartenstil und
      # Übersichtskarte sind ERZEUGT (PilzBuddy #226). Wird er rot, steht
      # im Log, welches Asset und wie man es neu erzeugt.
      - name: Generated assets are fresh
        run: |
          python3 tool/generated_assets.py --check > /dev/null
          python3 tool/brand_icons.py --check
      - name: Nothing private in the repository
        run: python3 tool/private_info_check.py

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      # `--no-web-resources-cdn`: Ohne den Flag holt der Loader CanvasKit
      # von www.gstatic.com — offline tot, und die IP jedes Besuchers ginge
      # an Google. Die Dateien liegen ohnehin im Build.
      - run: flutter build web --release --base-href /trailbuddy/ --no-web-resources-cdn
      # Der Service Worker entscheidet, ob die App ohne Netz startet, und ein
      # Fehler darin ist von außen unsichtbar. Echter Chrome gegen den
      # gebauten Ordner, Webserver wird dabei wirklich abgeschaltet.
      - name: Der Service Worker startet die App ohne Server
        run: node tool/check_service_worker.mjs build/web
      # Der Web-Push-Worker entscheidet, ob eine Meldung im Browser
      # erscheint; FCM quittiert auch dann „ok", wenn danach nichts
      # passiert. Echter Chrome, echtes push-Ereignis, Freigabe und
      # Vorschau auf einem Ursprung (PilzBuddy 1.203.0).
      - name: Der Push-Worker zeigt und übergibt Meldungen richtig
        run: node tool/check_push_worker.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      # Ohne key.properties fällt der Build auf Debug-Signing zurück — für
      # den Kompilier-Check reicht das. Bewusst der `play`-Flavor: Bricht das
      # Zusammenführen von src/play/AndroidManifest.xml, soll es HIER
      # auffallen und nicht in release.yml, wo der Tag schon steht.
      - run: flutter build apk --release --flavor play
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-play
          path: build/app/outputs/flutter-apk/app-play-release.apk
          retention-days: 14

  # Probelauf gegen einen lokalen Supabase-Stack (supabase/config.toml): beide
  # Wege, die es in der Wirklichkeit gibt — Bestand (Basis-Schema, dann nur
  # die Patches dieses PRs) und Frischinstallation (nur schema.sql). Dazu der
  # Abgleich mit echten Linien (tool/matcher_check.sql) und die Auth-Flows
  # gegen echtes GoTrue. Erst wenn beides grün ist, fasst der Schema Check
  # die Live-Datenbank an.
  schema-dry-run:
    name: Schema Dry Run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch-Buchführung prüfen
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: bash tool/patch_guard.sh
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.109.1
      - name: Lokalen Supabase-Stack starten
        run: bash tool/ci_supabase_start.sh
      - name: Basis-Schema einspielen (Stand des Ziel-Branches)
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          if git cat-file -e "$BASE_REF:supabase/schema.sql" 2>/dev/null; then
            git show "$BASE_REF:supabase/schema.sql" > /tmp/base_schema.sql
          else
            # Der Ziel-Branch hat noch kein Schema (erster PR): Der
            # Bestands-Weg IST dann die Frischinstallation.
            cp supabase/schema.sql /tmp/base_schema.sql
          fi
          psql "postgresql://postgres:postgres@127.0.0.1:54522/postgres" -v ON_ERROR_STOP=1 -q -f /tmp/base_schema.sql
      - name: Neue Patches dieses PRs obendrauf
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54522/postgres
        run: bash tool/db_migrate.sh
      - name: App-Queries gegen den aufgerüsteten Bestand prüfen
        env:
          # Der Check fragt den letzten stabilen Release-Stand ab (Aussperr-
          # Grenze); ohne Token gilt auf geteilten Runnern das IP-Limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUPABASE_URL=http://127.0.0.1:54521 \
          SUPABASE_KEY=$(supabase status -o json | jq -r '.ANON_KEY') \
          bash tool/schema_check.sh
      - name: Der Abgleich mit echten Linien (matcher_check.sql)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54522/postgres" -v ON_ERROR_STOP=1 -q -f tool/matcher_check.sql
      - name: Rechte des Service-Schlüssels (Bestand)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54522/postgres" -v ON_ERROR_STOP=1 -q -f tool/grants_check.sql
      # PL/pgSQL prüft den Rumpf erst beim Aufruf; live ruft ihn der
      # Cron-Job jede Minute, und ein Fehler darin legte alle
      # Benachrichtigungen still. Zurückgerollt, es geht nichts hinaus.
      - name: Push-Versand wirklich aufrufen (push_flush)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54522/postgres
        run: bash tool/push_flush_check.sh
      - name: Datenbank auf null zurücksetzen
        run: supabase db reset
      # Derselbe Weg wie beim ersten Lauf gegen ein leeres Live-Projekt:
      # db_migrate.sh erkennt die leere Datenbank und spielt schema.sql ein.
      - name: Frischinstallation über db_migrate.sh (nur schema.sql)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54522/postgres
        run: bash tool/db_migrate.sh
      - name: Nichts mehr offen (die Saat trägt die alten Patches)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54522/postgres
        run: bash tool/db_migrate.sh
      - name: App-Queries gegen das frische Schema prüfen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUPABASE_URL=http://127.0.0.1:54521 \
          SUPABASE_KEY=$(supabase status -o json | jq -r '.ANON_KEY') \
          bash tool/schema_check.sh
      - name: Rechte des Service-Schlüssels (Frischinstallation)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54522/postgres" -v ON_ERROR_STOP=1 -q -f tool/grants_check.sql
      - name: Auth-Mail-Flows end-to-end prüfen
        run: bash tool/auth_reset_check.sh

  # Spielt neue Patches dieses PRs in die Live-Datenbank ein (beim ersten
  # Lauf gegen das leere Projekt: schema.sql) und prüft danach die
  # App-Queries gegen das Live-Schema. Ohne eingespielten Patch kein Merge
  # (PilzBuddy #27). Braucht das Secret SUPABASE_DB_URL (Session-Pooler-URI
  # inkl. Passwort); der Check selbst geht über den Publishable Key aus
  # lib/core/supabase_config.dart.
  schema-check:
    name: Schema Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Die Produktion wird erst angefasst, wenn der Aufbau von null
    # durchgelaufen ist — das ist der eigentliche Gewinn des Dry Runs.
    needs: schema-dry-run
    steps:
      - uses: actions/checkout@v7
        with:
          # Ohne Historie kann db_migrate.sh nicht entscheiden, ob DIESER PR
          # einen Patch hinzufügt (Dependabot-Läufe bekommen das Secret nicht).
          fetch-depth: 0
      - name: DB-Patches einspielen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: bash tool/db_migrate.sh
      - name: Live-Schema gegen die App-Queries prüfen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/schema_check.sh

  housekeeping:
    name: Version Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Versions-Bump prüfen
        # Branch-Namen über `env:` statt direkt im `run:`-Block — ein
        # Branch-Name ist von außen wählbar (PilzBuddy-Begründung).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          latest=$(git tag -l 'v*' | sort -V | tail -1)
          echo "pubspec: $version — letzter Tag: ${latest:-keiner}"
          if [ -z "$latest" ]; then
            echo "Noch kein Release-Tag — nichts zu prüfen."
            exit 0
          fi
          if [ "$(printf '%s\n' "${latest#v}" "$version" | sort -V | tail -1)" != "$version" ] \
             || [ "${latest#v}" = "$version" ]; then
            # Ausgenommen: *.md (außer CHANGELOG.md, die liegt als Asset im
            # Binary), .github/, tool/, supabase/, docs/, .claude/, .codex/, .mcp.json
            # (Agenten-Konfiguration, #237) — nichts davon landet je in
            # einem Binary.
            if [ "$EVENT_NAME" = "pull_request" ]; then
              range="origin/$BASE_REF...HEAD"
            else
              range="$latest..HEAD"
            fi
            changed=$(
              {
                git diff --name-only "$range" -- . ':!*.md' ':!.github' ':!tool' ':!supabase' ':!docs' ':!.claude' ':!.codex' ':!.mcp.json' || true
                git diff --name-only "$range" -- CHANGELOG.md || true
              } | grep -v '^$' || true
            )
            if [ -n "$changed" ]; then
              echo "::error::Code geändert, aber version in pubspec.yaml ($version) ist nicht größer als $latest. Bitte Version bumpen (beide Teile, z. B. 0.1.0+1 → 0.1.1+2) — ohne Bump gibt es kein Release."
              exit 1
            fi
          fi
