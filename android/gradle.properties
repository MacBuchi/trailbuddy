org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin (AGP 9) ist jetzt Pflicht: maplibre_android 0.3.7+1
# wendet das Kotlin-Gradle-Plugin nicht mehr selbst an und setzt AGPs
# eigene Kotlin-Unterstützung voraus. Alle anderen Android-Plugins im
# Lock sind entweder kotlin-frei oder conditional (`if (agpMajor < 9 ||
# !builtInKotlin)`), deshalb verliert `kotlin-android` in
# android/app/build.gradle.kts seine Rolle. Zu prüfen im CI-APK-Job.
android.builtInKotlin=true
