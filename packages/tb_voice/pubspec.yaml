name: tb_voice
description: >-
  Die Sprachausgabe des Geräts für TrailBuddys Ansagen (#525) — Android
  (Java, TextToSpeech) und iOS (Swift, AVSpeechSynthesizer, #644); die
  Dart-Seite steht in der App
  (lib/features/routing/voice_service.dart). Ein Plugin, damit es auch in
  der Engine des Vordergrund-Dienstes registriert ist.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: de.mcbuchi.trailbuddy.voice
        pluginClass: TbVoicePlugin
      ios:
        pluginClass: TbVoicePlugin
