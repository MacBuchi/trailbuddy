name: tb_ambient
description: >-
  Licht- und Näherungssensor des Geräts für die Sensor-Rohdaten einer Fahrt
  (#491: „Handy in der Tasche" als optionales Merkmal) — nur der
  Android-Teil; die Dart-Seite steht in der App
  (lib/features/rides/sensor_log.dart). Ein Plugin, damit es auch in der
  Engine des Vordergrund-Dienstes registriert ist (dort läuft der Logger).
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: de.mcbuchi.trailbuddy.ambient
        pluginClass: TbAmbientPlugin
