name: trailbuddy
description: "TrailBuddy — Mountainbike-Trails mit deinen Buddys teilen."
publish_to: 'none'

# Beide Teile erhöhen (z. B. 0.1.0+1 → 0.1.1+2). Ein Bump auf main taggt und
# baut ein Prerelease (release.yml); ohne Bump kein Release (Version Guard).
version: 0.88.0+112

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # Karte: flutter_map ist die Engine im Web und der Rückfall auf Android
  # (lib/features/map/map_view/). Online noch OSM-Raster, ohne Empfang die
  # mitgelieferte Vektor-Übersicht (docs/konzept-offline-karten.md).
  flutter_map: ^8.3.2
  # 0.9 statt 0.10, weil `pmtiles` 1.x nur 0.9 kennt — dieselbe Lage wie
  # in PilzBuddy.
  latlong2: ^0.9.1
  # Vektor-Kacheln für flutter_map. Nur Beta-Versionen von
  # vector_map_tiles unterstützen flutter_map 8 — deshalb exakt gepinnt.
  # 9.0.0-beta.9 nutzt bewusst noch den stabilen Canvas-Renderer (die
  # 10er-Linie zieht den experimentellen GPU-Stack samt Native-Builds nach
  # sich).
  vector_map_tiles: 9.0.0-beta.9
  vector_tile_renderer: ^6.1.0
  pmtiles: ^1.3.0
  # Der MVT-Decoder, den vector_map_tiles ohnehin mitbringt — direkte
  # Abhängigkeit, weil das Zerlege-Blatt (#29) die Wege-Ebene der
  # gespeicherten Kacheln selbst liest; nicht an einer Beta hängen.
  vector_tile: ^2.0.1
  # Direkt (statt nur transitiv über vector_map_tiles), damit
  # `worthReporting` in lib/core/errors.dart typisiert auf
  # CancellationException prüfen kann — der Kachelrenderer bricht Kacheln
  # ab, sobald sie aus dem Bild wandern, und jede davon wäre sonst eine
  # Zeile in `error_reports` (PilzBuddy #136).
  executor_lib: ^1.1.1
  # Die Karten-Engine auf Android (nativer GPU-Renderer maplibre-native).
  # 0.x und jung, deshalb exakt gepinnt; Upgrades nur bewusst. Web sieht
  # das Paket nie (bedingter Import in map_view.dart).
  maplibre: 0.3.5
  # Die Android-Seite AUSDRÜCKLICH auf 0.3.5: 0.3.6 wendet in seinem
  # build.gradle.kts das ktlint-Plugin ohne Version an, und Gradle findet
  # es dann in keinem Plugin-Repository — der APK-Build bricht ab, bevor
  # eine Zeile Kotlin kompiliert. PilzBuddy baut mit 0.3.5.
  maplibre_android: 0.3.5

  supabase_flutter: ^2.18.0
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.2
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  # GPX-Import: Dateiauswahl auf Android und Web, XML-Parser.
  file_selector: ^1.0.3
  xml: ^7.1.0
  share_plus: ^13.3.0
  path_provider: ^2.1.5
  archive: ^3.4.10
  geolocator: ^14.0.2
  # Fahrt aufzeichnen (#28): Foreground-Service vom Typ `location`, die
  # Messung läuft in dessen eigenem Isolate (überlebt das Wegwischen der
  # App). Kein Web — nur über bedingten Import in
  # lib/features/rides/ride_service.dart eingebunden.
  flutter_foreground_task: ^11.0.3
  # Ausgangskorb (#30): Verbindung zurück ⇒ wartende Aufträge senden.
  connectivity_plus: ^7.3.1
  # Gespeicherte Kartenbereiche im Browser (Konzept-Schritt 3): IndexedDB
  # über idb_shim, dieselbe Implementierung läuft im Test im Speicher.
  idb_shim: ^2.9.2
  # Push-Benachrichtigungen (#34): Firebase Cloud Messaging, sonst nichts
  # von Firebase — kein Analytics, kein Crashlytics. Push ist ein
  # NEBENFEATURE: Jeder Fehlerpfad in lib/core/push_messaging.dart endet
  # in „kein Token"; ein fehlendes Firebase-Projekt (google-services.json
  # wird nur eingebunden, wenn die Datei da ist) hindert die App nicht am
  # Starten.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  # Der Web-Push-Worker reicht Meldungen per postMessage an die Seite
  # (lib/core/push_web_bridge_web.dart); direkt, statt an einer
  # transitiven Version zu hängen.
  web: ^1.1.1
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - CHANGELOG.md
    # Die Lizenztexte der gebündelten Schriften (SIL OFL) — die App zeigt
    # sie unter „Open-Source-Lizenzen" (`registerFontLicenses`).
    - assets/fonts/Barlow-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
    # Kartenstil für BEIDE Engines (erzeugt aus @protomaps/basemaps,
    # Flavor LIGHT, deutsche Labels, Wege hervorgehoben) — nicht von Hand
    # editieren, `tool/generated_assets.py --check` wacht darüber.
    - assets/map_style/protomaps_light_de.json
    # Eingebaute Übersichtskarte (DACH, Zoom 0–7, ~9 MB): die unterste
    # Ebene, sobald kein Empfang besteht. Erzeugt mit
    # `pmtiles extract <Protomaps-Daily-Build> --bbox=5.5,45.5,17.5,55.5 --maxzoom=7`.
    - assets/offline_maps/overview_dach.pmtiles
    # Schriftzeichen (Glyph-PBFs) für die MapLibre-Engine: Noto-Sans-Stacks
    # (SIL OFL, siehe assets/map_glyphs/OFL.txt), fünf Unicode-Bereiche —
    # reicht für deutsche Kartenbeschriftung. MapLibre lädt Glyphs nur von
    # Platte/URL, deshalb werden sie beim Start ins App-Verzeichnis
    # materialisiert (maplibre_style_provider.dart).
    - assets/map_glyphs/noto-sans-regular/
    - assets/map_glyphs/noto-sans-medium/
    # Der OFL-Text zu genau diesen Glyphen. Eigene Zeile: Die
    # Verzeichnis-Einträge nehmen nur Dateien direkt darin mit.
    - assets/map_glyphs/OFL.txt

  # Schriften als Assets, nicht über google_fonts zur Laufzeit: Die App
  # muss offline genauso aussehen. Nur die Schnitte, die das Design nutzt.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
