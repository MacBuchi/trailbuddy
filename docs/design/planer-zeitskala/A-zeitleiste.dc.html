<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Zeitleiste im Ergebnis</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B6F04A}a:hover{color:#D4FF8A}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E1411; color: #F2F4EF; font-family: Barlow, sans-serif;">

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 372px; background: #ECEDE4;">
    <svg width="390" height="372" viewBox="0 0 390 372" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
      <path d="M0 300 C80 290 140 320 210 312 S330 280 390 296" fill="none" stroke="#FFFFFF" stroke-width="6"></path>
      <path d="M40 0 C60 90 30 170 70 260 S90 340 80 372" fill="none" stroke="#FFFFFF" stroke-width="4"></path>
      <path d="M390 120 C320 140 260 110 220 150 S150 200 120 190" fill="none" stroke="#FFFFFF" stroke-width="4"></path>
      <path d="M160 0 C170 60 230 70 250 130" fill="none" stroke="#D8DACF" stroke-width="2"></path>
      <path d="M0 80 C60 70 110 100 150 60" fill="none" stroke="#D8DACF" stroke-width="2"></path>
    </svg>
    <sc-for list="{{trails}}" as="t" hint-placeholder-count="10">
      <svg width="390" height="372" viewBox="0 0 390 372" aria-hidden="true" style="position: absolute; left: 0; top: 0; opacity: {{t.op}};">
        <path d="{{t.d}}" fill="none" stroke="#B6F04A" stroke-opacity="{{t.band}}" stroke-width="14" stroke-linecap="round"></path>
        <path d="{{t.d}}" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"></path>
        <path d="{{t.d}}" fill="none" stroke="{{t.color}}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="{{t.dash}}"></path>
      </svg>
    </sc-for>
    <div style="position: absolute; left: 186px; top: 300px; width: 18px; height: 18px; border-radius: 50%; background: #B6F04A; border: 3px solid #0E1411; box-sizing: border-box;"></div>
  </div>

  <div style="position: absolute; left: 0; top: 340px; width: 390px; height: 504px; background: #161E19; border-radius: 24px 24px 0 0; box-sizing: border-box; padding: 10px 20px 20px; display: flex; flex-direction: column; gap: 14px;">
    <div style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #2A3630;"></div>

    <div style="display: flex; align-items: flex-start; gap: 12px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.08em; color: #B6F04A;">{{tagline}}</div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.02em; text-transform: uppercase;">{{title}}</div>
      </div>
      <button aria-label="Ergebnis schließen" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1F2923; color: #9AA69D; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
      <div style="background: #1F2923; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 11px; color: #9AA69D;">Strecke</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px;">{{cur.km}}<span style="font-size: 11px; color: #9AA69D;"> km</span></div>
      </div>
      <div style="background: #1F2923; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: #9AA69D;"><span>Bergauf</span><span>von 800</span></div>
        <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; color: {{cur.hmColor}};">{{cur.hm}}</div>
        <div style="position: relative; height: 4px; border-radius: 2px; background: #2A3630;">
          <div style="position: absolute; left: 0; top: 0; height: 4px; border-radius: 2px; width: {{cur.hmPct}}%; background: {{cur.hmFill}};"></div>
        </div>
      </div>
      <div style="background: #1F2923; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 11px; color: #9AA69D;">Trails</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px;">{{cur.n}}</div>
      </div>
      <div style="background: #1F2923; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 11px; color: #9AA69D;">Zeit</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px;">{{cur.timeShort}}</div>
      </div>
    </div>

    <div style="background: #1F2923; border-radius: 14px; padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.08em; color: #9AA69D;">ANDERE RUNDEN · HÖHE = TRAIL-ANTEIL</div>
        <div style="font-size: 11px; color: #9AA69D;">Ziel 3 h ± 30</div>
      </div>
      <div style="position: relative; width: 318px; height: 84px;">
        <div style="position: absolute; left: 79px; top: 0; width: 159px; height: 84px; background: rgba(182,240,74,0.10); border-radius: 6px;"></div>
        <div style="position: absolute; left: 158px; top: 0; width: 2px; height: 84px; background: rgba(242,244,239,0.55);"></div>
        <div style="position: absolute; left: 0; bottom: 0; width: 318px; height: 1px; background: #3A4840;"></div>
        <sc-for list="{{points}}" as="p" hint-placeholder-count="7">
          <button aria-label="{{p.aria}}" onClick="{{p.pick}}" style="position: absolute; bottom: 0; left: {{p.left}}px; width: 36px; height: 84px; padding: 0; border: none; background: transparent; cursor: pointer;">
            <div style="position: absolute; left: 17px; bottom: 0; width: 2px; height: {{p.stemH}}px; background: {{p.stemColor}}; {{p.stemExtra}}"></div>
            <div style="position: absolute; {{p.headCss}}"></div>
            <sc-if value="{{p.isPick}}" hint-placeholder-val="{{false}}">
              <div style="position: absolute; left: -14px; width: 64px; text-align: center; bottom: {{p.tagBottom}}px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.08em; color: #B6F04A;">VORSCHLAG</div>
            </sc-if>
          </button>
        </sc-for>
      </div>
      <div style="position: relative; width: 318px; height: 14px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #9AA69D;">
        <span style="position: absolute; left: 0;">2 h</span>
        <span style="position: absolute; left: 66px;">2:30</span>
        <span style="position: absolute; left: 150px;">3 h</span>
        <span style="position: absolute; left: 225px;">3:30</span>
        <span style="position: absolute; right: 0;">4 h</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 4px; border-top: 1px solid #2A3630; font-size: 14px;">
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700;">{{cur.time}}</span>
        <span style="color: #9AA69D;">·</span>
        <span><b style="font-family: 'JetBrains Mono', monospace;">{{cur.share}} %</b> Trail</span>
        <span style="color: #9AA69D;">·</span>
        <span>bis</span>
        <span style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; background: {{cur.gradeColor}}; color: #0E1411; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px;"><span style="display: inline-block; {{cur.shieldCss}}"></span>{{cur.grade}}</span>
      </div>
      <div style="font-size: 12px; color: {{cur.noteColor}};">{{cur.note}}</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: auto;">
      <button style="height: 52px; border-radius: 14px; border: none; background: #B6F04A; color: #0E1411; font-weight: 600; font-size: 16px; cursor: pointer;">Fahrt starten</button>
      <div style="display: flex; justify-content: center; gap: 4px;">
        <button style="min-height: 44px; padding: 0 14px; border: none; background: transparent; color: #B6F04A; font-weight: 600; font-size: 14px; cursor: pointer;">Bearbeiten</button>
        <button style="min-height: 44px; padding: 0 14px; border: none; background: transparent; color: #B6F04A; font-weight: 600; font-size: 14px; cursor: pointer;">Speichern</button>
        <button style="min-height: 44px; padding: 0 14px; border: none; background: transparent; color: #B6F04A; font-weight: 600; font-size: 14px; cursor: pointer;">GPX</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showOverLimit":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
var GRADE = ['#4CC46E', '#5A9BF0', '#F0605C', '#F2F4EF'];
var STATES = [
  { m: 58, share: 31, hm: 210, g: 1, n: 1, km: 11.2, add: 'Wurzelpfad', ag: 1 },
  { m: 84, share: 34, hm: 320, g: 1, n: 2, km: 15.0, add: 'Buchenhang', ag: 1 },
  { m: 112, share: 29, hm: 410, g: 2, n: 3, km: 19.8, add: 'Steinbruch', ag: 2 },
  { m: 138, share: 33, hm: 520, g: 2, n: 4, km: 22.6, add: 'Bachtobel', ag: 2 },
  { m: 151, share: 36, hm: 560, g: 2, n: 5, km: 24.1, add: 'Fuchsbau', ag: 1 },
  { m: 172, share: 31, hm: 650, g: 2, n: 6, km: 27.9, add: 'Kammweg', ag: 0 },
  { m: 186, share: 38, hm: 700, g: 3, n: 7, km: 29.6, add: 'Hohlweg', ag: 3 },
  { m: 207, share: 35, hm: 770, g: 3, n: 8, km: 32.8, add: 'Eichkopf', ag: 2 },
  { m: 224, share: 33, hm: 795, g: 3, n: 9, km: 35.4, add: 'Schanze', ag: 2 },
  { m: 235, share: 37, hm: 880, g: 3, n: 10, km: 36.9, add: 'Felsriegel', ag: 3, over: true }
];
var PATHS = [
  'M150 280 C130 250 120 230 110 200',
  'M240 285 C260 260 270 240 285 215',
  'M95 170 C80 140 85 115 100 90',
  'M300 190 C315 160 320 135 310 105',
  'M130 120 C150 100 165 90 185 80',
  'M210 70 C235 65 255 70 275 80',
  'M60 240 C50 215 45 195 50 165',
  'M330 250 C345 225 350 205 345 180',
  'M120 330 C100 320 85 305 75 285',
  'M200 40 C180 30 160 30 140 40'
];
var PICK = 6, LIMIT = 800;
function hm(m) { return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0'); }
function hmShort(m) { return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); }
function km(v) { return v.toFixed(1).replace('.', ','); }
function shape(g, size, color) {
  var base = 'width:' + size + 'px;height:' + size + 'px;box-sizing:border-box;';
  if (g === 0) return base + 'border-radius:50%;border:2px solid ' + color + ';';
  if (g === 1) return base + 'border-radius:50%;background:' + color + ';';
  if (g === 2) return base + 'border-radius:2px;background:' + color + ';';
  var s = Math.round(size * 0.8);
  return 'width:' + s + 'px;height:' + s + 'px;transform:rotate(45deg);background:' + color + ';';
}
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: PICK }; }
  renderVals() {
    var self = this;
    var over = this.props.showOverLimit ?? true;
    var sel = this.state.sel;
    if (!over && STATES[sel].over) sel = PICK;
    var s = STATES[sel];
    var points = [];
    STATES.forEach(function (st, i) {
      if (st.m < 120 || st.m > 240) return;
      if (st.over && !over) return;
      var x = (st.m - 120) / 120 * 318;
      var stemH = (st.share - 22) * 3;
      var isSel = i === sel;
      var color = st.over ? 'transparent' : GRADE[st.g];
      var head = 'left:12px;bottom:' + (stemH - 2) + 'px;' + (st.over
        ? 'width:12px;height:12px;box-sizing:border-box;border-radius:50%;border:1.5px dashed #FF8A3D;'
        : shape(st.g, 12, color));
      if (st.g === 3 && !st.over) head = 'left:13px;bottom:' + (stemH - 1) + 'px;' + shape(3, 12, color);
      if (isSel) head += 'box-shadow:0 0 0 3px #1F2923,0 0 0 5px #B6F04A;';
      points.push({
        left: x - 18,
        stemH: stemH,
        stemColor: isSel ? '#B6F04A' : (st.over ? 'transparent' : '#4A5A50'),
        stemExtra: st.over ? 'border-left:2px dashed #FF8A3D;width:0;' : '',
        headCss: head,
        isPick: i === PICK,
        tagBottom: stemH + 16,
        aria: hm(st.m) + ', ' + st.share + ' Prozent Trail, bis S' + st.g + (st.over ? ', über dem Höhenmeter-Limit' : ''),
        pick: function () { self.setState({ sel: i }); }
      });
    });
    var trails = PATHS.map(function (d, i) {
      var inside = i <= sel;
      return {
        d: d,
        op: inside ? 1 : 0.35,
        band: inside ? 0.55 : 0,
        color: GRADE[STATES[i].ag] === '#F2F4EF' ? '#131A16' : ['#1F7A3A', '#1F6FD1', '#C62828', '#131A16'][STATES[i].ag],
        dash: 'none'
      };
    });
    var note;
    if (s.over) note = 'Mit Felsriegel – ' + (s.hm - LIMIT) + ' hm über deinem Limit. Antippen zum Anheben.';
    else if (sel === PICK) note = 'Vorschlag des Planers · zuletzt dazu: ' + s.add;
    else note = (sel < PICK ? 'Kürzer: ohne ' + STATES.slice(sel + 1, PICK + 1).map(function (x) { return x.add; }).join(', ') : 'Länger: zusätzlich ' + STATES.slice(PICK + 1, sel + 1).map(function (x) { return x.add; }).join(', '));
    return {
      tagline: sel === PICK ? 'VORSCHLAG · RUNDE' : 'ANDERE RUNDE',
      title: s.n + ' Trails · ' + km(s.km) + ' km',
      points: points,
      trails: trails,
      cur: {
        km: km(s.km),
        hm: s.hm,
        hmPct: Math.min(100, s.hm / LIMIT * 100),
        hmFill: s.over ? '#FF8A3D' : '#B6F04A',
        hmColor: s.over ? '#FF8A3D' : '#F2F4EF',
        n: s.n,
        time: 'ca. ' + hm(s.m),
        timeShort: hmShort(s.m),
        share: s.share,
        grade: 'S' + s.g,
        gradeColor: GRADE[s.g],
        shieldCss: shape(s.g, 8, '#0E1411'),
        note: note,
        noteColor: s.over ? '#FF8A3D' : '#9AA69D'
      }
    };
  }
}
</script>
</body>
</html>
